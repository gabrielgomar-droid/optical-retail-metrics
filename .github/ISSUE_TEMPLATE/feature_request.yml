name: Feature request
description: Propose a generic retail/CX improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user problem before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: metric
    attributes:
      label: Metric/data definition
      description: If relevant, state grain, population, numerator, denominator, period and cohort/maturity rules.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: evidence
    attributes:
      label: Synthetic example
      description: Provide a synthetic example if possible; do not include private operational data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm that this request contains no private business data or personal information.
          required: true
