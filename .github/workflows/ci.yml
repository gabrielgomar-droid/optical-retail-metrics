name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: CSV parser
        run: node tests.js
      - name: NPS
        run: node nps-tests.js
      - name: Appointments
        run: node agenda-tests.js
      - name: Sales
        run: node ventas-tests.js
      - name: Quotes
        run: node cotizaciones-tests.js
      - name: Python server syntax
        run: python3 -m py_compile serve_demo.py
